# 이 저장소 안에서만 쓰는 Codex 설정입니다. 내 PC 전체 설정(~/.codex/config.toml)은 건드리지 않습니다.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[windows]
sandbox = "unelevated"

# 분석 기록 원본: 읽기 전용으로만 씁니다.
[mcp_servers.review-logs]
command = "npx"
args = ["-y", "mcp-sqlite@1.0.9", "data/sample_logs.db"]

# 쓰기 가능한 사본: 고쳐 봐도 되는 곳입니다.
[mcp_servers.review-dev]
command = "npx"
args = ["-y", "mcp-sqlite@1.0.9", "data/dev.db"]

# 최신 공식 문서를 찾아 줍니다.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@4.4.4"]

