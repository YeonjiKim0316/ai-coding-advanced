# Render Blueprint: 이 파일을 읽고 웹 서비스를 만듭니다.
# 파이썬 버전은 저장소 맨 위의 .python-version(3.12)이 정합니다.
services:
  - type: web
    name: hy-review-thermo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        sync: false

